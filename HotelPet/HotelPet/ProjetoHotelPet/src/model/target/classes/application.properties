# Configura\u00e7\u00e3o da fonte de dados (conex\u00e3o com o banco de dados MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_pet_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=HotelPet
spring.datasource.password=123456789

# Configura\u00e7\u00e3o do Hibernate para criar ou atualizar o banco de dados automaticamente
spring.jpa.hibernate.ddl-auto=create-drop  # Op\u00e7\u00f5es: none, update, create, create-drop

# Define o modo de log do SQL, se necess\u00e1rio para depura\u00e7\u00e3o
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialeto do Hibernate para o MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
